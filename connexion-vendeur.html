<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Connexion Administrateur | Vendoza</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101828, #263c63);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 35px 25px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      margin: 0;
      color: #1769ff;
      font-size: 34px;
    }

    .logo p {
      color: #667085;
      font-size: 14px;
    }

    h2 {
      text-align: center;
      color: #101828;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      color: #344054;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #1769ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.5;
    }

    #message.error {
      display: block;
      color: #b42318;
      background: #fef3f2;
    }

    #message.success {
      display: block;
      color: #027a48;
      background: #ecfdf3;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      color: #667085;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="login-container">

    <div class="logo">
      <h1>Vendoza</h1>
      <p>Espace sécurisé de gestion</p>
    </div>

    <h2>Connexion administrateur</h2>

    <form id="loginForm">

      <label for="email">Adresse e-mail</label>
      <input
        type="email"
        id="email"
        placeholder="Votre adresse e-mail"
        autocomplete="username"
        required
      >

      <label for="password">Mot de passe</label>
      <input
        type="password"
        id="password"
        placeholder="Votre mot de passe"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Se connecter
      </button>

      <div id="message" role="alert" aria-live="polite"></div>

    </form>

    <div class="footer">
      Vendoza &copy; 2026 — Accès réservé aux administrateurs
    </div>

  </main>

  <!-- Bibliothèque Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://kzrphvyhkbuhaczmnjgk.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_ZvVK-d8qoaqi4__K0cqoyg_IsCaAqPO";

    // Initialisation du client Supabase
    let clientVendoza = null;

    if (
      window.supabase &&
      typeof window.supabase.createClient === "function"
    ) {
      clientVendoza = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );
    }

    const formulaire = document.getElementById("loginForm");
    const bouton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    function afficherMessage(texte, type) {
      message.textContent = texte;
      message.className = type;
    }

    formulaire.addEventListener("submit", async function(event) {
      event.preventDefault();

      bouton.disabled = true;
      bouton.textContent = "Connexion en cours...";
      message.textContent = "";
      message.className = "";

      let connexionReussie = false;

      try {
        if (!clientVendoza) {
          throw new Error(
            "Supabase ne s'est pas chargé. Vérifiez votre connexion Internet et rechargez la page."
          );
        }

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        // 1. Connexion à Supabase Auth
        const { data, error } =
          await clientVendoza.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          throw new Error(
            "Échec de connexion : " + error.message
          );
        }

        if (!data.user) {
          throw new Error(
            "Aucun utilisateur n'a été retourné."
          );
        }

        // 2. Vérification du profil administrateur
        const {
          data: profil,
          error: erreurProfil
        } = await clientVendoza
          .from("profiles")
          .select("user_id, role")
          .eq("user_id", data.user.id)
          .maybeSingle();

        if (erreurProfil) {
          throw new Error(
            "Erreur de lecture du profil : " +
            erreurProfil.message
          );
        }

        if (!profil) {
          await clientVendoza.auth.signOut();

          throw new Error(
            "Profil introuvable dans la table profiles."
          );
        }

        if (
          String(profil.role || "").trim().toLowerCase() !== "admin"
        ) {
          await clientVendoza.auth.signOut();

          throw new Error(
            "Accès refusé : votre compte n'est pas administrateur."
          );
        }

        // 3. Nettoyage des anciennes données locales
        localStorage.removeItem("vendozaVendeurConnecte");
        localStorage.removeItem("vendozaVendeurNom");

        connexionReussie = true;

        afficherMessage(
          "Connexion réussie ! Ouverture du tableau de bord...",
          "success"
        );

        bouton.textContent = "Connexion réussie...";

        // 4. Redirection vers le tableau de bord
        setTimeout(function() {
          window.location.href = "./tableau%20de%20bord.html";
        }, 800);

      } catch (error) {
        console.error("Erreur Vendoza :", error);

        afficherMessage(
          error.message || "Une erreur inattendue est survenue.",
          "error"
        );

      } finally {
        if (!connexionReussie) {
          bouton.disabled = false;
          bouton.textContent = "Se connecter";
        }
      }
    });
  </script>

</body>
</html>
