<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Connexion Administrateur | Vendoza</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101828, #263c63);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 35px 25px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      margin: 0;
      color: #1769ff;
      font-size: 34px;
      font-weight: bold;
    }

    .logo p {
      margin-top: 8px;
      color: #667085;
      font-size: 14px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #101828;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #344054;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      display: block;
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #1769ff;
      box-shadow: 0 0 0 3px rgba(23, 105, 255, 0.12);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #1769ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0f50cc;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      padding: 12px;
      margin-top: 18px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #message.error {
      display: block;
      color: #b42318;
      background: #fef3f2;
      border: 1px solid #fecdca;
    }

    #message.success {
      display: block;
      color: #027a48;
      background: #ecfdf3;
      border: 1px solid #abefc6;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      color: #667085;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="login-container">

    <div class="logo">
      <h1>Vendoza</h1>
      <p>Espace sécurisé de gestion</p>
    </div>

    <h2>Connexion administrateur</h2>

    <form id="loginForm">

      <label for="email">Adresse e-mail</label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Votre adresse e-mail"
        autocomplete="username"
        required
      >

      <label for="password">Mot de passe</label>

      <input
        type="password"
        id="password"
        name="password"
        placeholder="Votre mot de passe"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Se connecter
      </button>

      <div id="message" role="alert" aria-live="polite"></div>

    </form>

    <div class="footer">
      Vendoza &copy; 2026 — Accès réservé aux administrateurs
    </div>

  </main>

  <!-- 1. Charger la bibliothèque Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 2. Charger la configuration du projet -->
  <script src="./supabase-config.js"></script>

  <!-- 3. Gérer la connexion -->
  <script>
    const formulaire = document.getElementById("loginForm");
    const bouton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    function afficherMessage(texte, type) {
      message.textContent = texte;
      message.className = type;
    }

    formulaire.addEventListener("submit", async function(event) {
      event.preventDefault();

      message.textContent = "";
      message.className = "";

      bouton.disabled = true;
      bouton.textContent = "Connexion en cours...";

      let connexionReussie = false;

      try {
        // Vérifier le chargement de la bibliothèque.
        if (!window.supabase) {
          throw new Error(
            "La bibliothèque Supabase ne s'est pas chargée. Vérifiez votre connexion Internet."
          );
        }

        // Vérifier l'initialisation du client.
        if (
          typeof supabase === "undefined" ||
          !supabase.auth
        ) {
          throw new Error(
            "Le client Supabase n'est pas initialisé. Vérifiez supabase-config.js et son emplacement."
          );
        }

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        // ÉTAPE 1 : Authentification.
        const { data, error } =
          await supabase.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          throw new Error(
            "Connexion refusée : " + error.message
          );
        }

        if (!data.user) {
          throw new Error(
            "Aucun utilisateur n'a été retourné par Supabase."
          );
        }

        // ÉTAPE 2 : Récupérer le profil.
        const { data: profil, error: erreurProfil } =
          await supabase
            .from("profiles")
            .select("user_id, role")
            .eq("user_id", data.user.id)
            .maybeSingle();

        if (erreurProfil) {
          throw new Error(
            "Erreur lors de la vérification du profil : " +
            erreurProfil.message
          );
        }

        // ÉTAPE 3 : Vérifier l'existence du profil.
        if (!profil) {
          await supabase.auth.signOut();

          throw new Error(
            "Profil introuvable. Vérifiez la table profiles dans Supabase."
          );
        }

        // ÉTAPE 4 : Vérifier le rôle administrateur.
        if (
          String(profil.role || "").trim().toLowerCase() !== "admin"
        ) {
          await supabase.auth.signOut();

          throw new Error(
            "Accès refusé : ce compte ne possède pas le rôle admin."
          );
        }

        // ÉTAPE 5 : Nettoyer les anciennes connexions locales.
        localStorage.removeItem("vendozaVendeurConnecte");
        localStorage.removeItem("vendozaVendeurNom");

        connexionReussie = true;

        afficherMessage(
          "Connexion réussie ! Ouverture du tableau de bord...",
          "success"
        );

        bouton.textContent = "Connexion réussie...";

        // ÉTAPE 6 : Rediriger vers le tableau de bord.
        setTimeout(function() {
          window.location.href = "./dashboard.html";
        }, 800);

      } catch (error) {
        console.error(
          "ERREUR CONNEXION VENDOZA :",
          error
        );

        afficherMessage(
          error.message ||
          "Une erreur inattendue est survenue.",
          "error"
        );

      } finally {
        if (!connexionReussie) {
          bouton.disabled = false;
          bouton.textContent = "Se connecter";
        }
      }
    });
  </script>

</body>
    </html>
