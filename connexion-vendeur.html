<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Vendoza - Connexion vendeur</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #2563eb);
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      color: white;
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 30px;

      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      text-align: center;
      color: #111827;
    }

    .description {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 13px;

      border: 1px solid #d1d5db;
      border-radius: 9px;

      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 50px;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);

      border: none;
      background: transparent;

      cursor: pointer;
      font-size: 20px;
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;

      border: none;
      border-radius: 9px;

      background: #2563eb;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
      margin-top: 8px;
    }

    button[type="submit"]:hover {
      background: #1d4ed8;
    }

    .message {
      display: none;

      margin-top: 15px;
      padding: 12px;

      border-radius: 8px;
      text-align: center;

      font-size: 14px;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #b91c1c;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .back {
      display: block;
      text-align: center;

      margin-top: 20px;

      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      text-decoration: underline;
    }

    .info {
      margin-top: 20px;
      padding: 12px;

      background: #f3f4f6;
      border-radius: 8px;

      text-align: center;
      font-size: 12px;
      color: #6b7280;
    }

    @media (max-width: 500px) {
      .card {
        padding: 22px;
      }

      .logo {
        font-size: 28px;
      }
    }
  </style></head><body><div class="container">  <div class="logo">
    🛍️ Vendoza
  </div>  <div class="card"><h1>🔐 Connexion vendeur</h1>

<p class="description">
  Connectez-vous pour accéder à votre espace vendeur.
</p>

<form id="loginForm">

  <div class="form-group">
    <label for="username">
      Nom d'utilisateur
    </label>

    <input
      type="text"
      id="username"
      placeholder="Entrez votre nom d'utilisateur"
      autocomplete="username"
      required
    >
  </div>

  <div class="form-group">

    <label for="password">
      Mot de passe
    </label>

    <div class="password-box">

      <input
        type="password"
        id="password"
        placeholder="Entrez votre mot de passe"
        autocomplete="current-password"
        required
      >

      <button
        type="button"
        class="toggle-password"
        onclick="afficherMotDePasse()"
      >
        👁️
      </button>

    </div>

  </div>

  <button type="submit">
    Se connecter
  </button>

  <div id="message" class="message"></div>

</form>

<a href="accueil.html" class="back">
  ← Retour à la boutique
</a>

<div class="info">
  Espace réservé aux vendeurs et administrateurs Vendoza.
</div>

  </div></div><script>

  // ==========================================
  // IDENTIFIANTS VENDEUR
  // ==========================================

  const VENDEUR_USERNAME = "admin";
  const VENDEUR_PASSWORD = "123456";


  // ==========================================
  // SI DÉJÀ CONNECTÉ
  // ==========================================

  const vendeurConnecte =
    localStorage.getItem("vendozaVendeurConnecte");

  if (vendeurConnecte === "true") {

    window.location.href = "dashboard.html";

  }


  // ==========================================
  // AFFICHER / CACHER MOT DE PASSE
  // ==========================================

  function afficherMotDePasse() {

    const password =
      document.getElementById("password");

    const bouton =
      document.querySelector(".toggle-password");

    if (password.type === "password") {

      password.type = "text";
      bouton.textContent = "🙈";

    } else {

      password.type = "password";
      bouton.textContent = "👁️";

    }

  }


  // ==========================================
  // CONNEXION
  // ==========================================

  document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

      event.preventDefault();

      const username =
        document.getElementById("username")
          .value
          .trim();

      const password =
        document.getElementById("password")
          .value;

      const message =
        document.getElementById("message");


      // Vérification

      if (
        username === VENDEUR_USERNAME &&
        password === VENDEUR_PASSWORD
      ) {

        localStorage.setItem(
          "vendozaVendeurConnecte",
          "true"
        );

        localStorage.setItem(
          "vendozaVendeurNom",
          username
        );


        message.textContent =
          "Connexion réussie !";

        message.className =
          "message success";


        setTimeout(function() {

          window.location.href =
            "dashboard.html";

        }, 700);


      } else {

        message.textContent =
          "Nom d'utilisateur ou mot de passe incorrect.";

        message.className =
          "message error";

      }

    });

</script></body>
</html>
