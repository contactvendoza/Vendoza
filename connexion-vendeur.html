<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendoza - Connexion administrateur</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #2563eb);
    }

    .container { width: 100%; max-width: 430px; }

    .logo {
      text-align: center;
      color: white;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    h1 {
      text-align: center;
      color: #111827;
      font-size: 25px;
    }

    .description {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
    }

    .info {
      margin-top: 20px;
      padding: 12px;
      background: #f3f4f6;
      border-radius: 8px;
      text-align: center;
      color: #6b7280;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">🛍️ Vendoza</div>

    <div class="card">
      <h1>🔐 Connexion administrateur</h1>

      <p class="description">
        Connectez-vous avec votre adresse e-mail.
      </p>

      <form id="loginForm">
        <label for="email">Adresse e-mail</label>
        <input
          type="email"
          id="email"
          autocomplete="username"
          placeholder="Votre adresse e-mail"
          required
        >

        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          autocomplete="current-password"
          placeholder="Votre mot de passe"
          required
        >

        <button type="submit" id="loginButton">
          Se connecter
        </button>

        <div id="message" class="message" role="status"></div>
      </form>

      <a href="accueil.html" class="back">
        ← Retour à la boutique
      </a>

      <div class="info">
        Accès réservé aux administrateurs autorisés de Vendoza.
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    function afficherMessage(texte, type) {
      message.textContent = texte;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      button.disabled = true;
      afficherMessage("Connexion en cours...", "success");

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          afficherMessage(
            "Connexion refusée. Vérifiez votre e-mail et votre mot de passe.",
            "error"
          );
          return;
        }

        const utilisateur = data.user;

        if (!utilisateur) {
          afficherMessage("Utilisateur introuvable.", "error");
          return;
        }

        const { data: profil, error: erreurProfil } = await supabase
          .from("profiles")
          .select("user_id, role")
          .eq("user_id", utilisateur.id)
          .maybeSingle();

        if (erreurProfil) {
          await supabase.auth.signOut();

          afficherMessage(
            "Erreur lors de la vérification du profil : " +
            erreurProfil.message,
            "error"
          );
          return;
        }

        if (!profil) {
          await supabase.auth.signOut();

          afficherMessage(
            "Votre connexion fonctionne, mais votre profil est introuvable. Vérifiez la table profiles et ses règles RLS.",
            "error"
          );
          return;
        }

        if (profil.role !== "admin") {
          await supabase.auth.signOut();

          afficherMessage(
            "Accès refusé : votre compte n'a pas le rôle administrateur.",
            "error"
          );
          return;
        }

        localStorage.removeItem("vendozaVendeurConnecte");
        localStorage.removeItem("vendozaVendeurNom");

        afficherMessage("Connexion réussie ! Ouverture du tableau de bord...", "success");

        window.location.replace("dashboard.html");

      } catch (error) {
        afficherMessage(
          "Une erreur inattendue est survenue. Vérifiez votre connexion Internet et la configuration Supabase.",
          "error"
        );
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
