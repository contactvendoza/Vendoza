<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vendoza - Produits</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f6fa;
  color: #222;
}

header {
  background: #111827;
  color: white;
  padding: 14px 18px;
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 2px 10px rgba(0,0,0,.15);
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  cursor: pointer;
}

.logo span {
  color: #f59e0b;
}

.menu {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}

.menu a {
  color: white;
  text-decoration: none;
  font-size: 14px;
  padding: 8px 10px;
  border-radius: 7px;
}

.menu a:hover {
  background: #374151;
}

.badge {
  background: #ef4444;
  color: white;
  border-radius: 50%;
  min-width: 19px;
  height: 19px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 25px 15px 50px;
}

h1 {
  text-align: center;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

.tools {
  background: white;
  padding: 15px;
  border-radius: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.07);
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 25px;
}

.tools input,
.tools select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 18px;
}

.card {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
  position: relative;
}

.product-image {
  width: 100%;
  height: 210px;
  object-fit: cover;
  background: #eee;
  display: block;
}

.favorite {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 50%;
  background: white;
  font-size: 22px;
  cursor: pointer;
}

.favorite.active {
  color: red;
}

.content {
  padding: 15px;
}

.category {
  color: #777;
  font-size: 13px;
  margin-bottom: 5px;
}

.name {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 8px;
}

.description {
  color: #666;
  font-size: 14px;
  min-height: 40px;
  line-height: 1.4;
}

.price {
  font-size: 20px;
  font-weight: bold;
  color: #111827;
  margin: 12px 0 5px;
}

.stock {
  font-size: 13px;
  margin-bottom: 12px;
}

.stock.ok {
  color: #15803d;
}

.stock.low {
  color: #d97706;
}

.stock.out {
  color: #dc2626;
}

.buttons {
  display: grid;
  gap: 8px;
}

button.action {
  border: none;
  border-radius: 8px;
  padding: 11px;
  font-weight: bold;
  cursor: pointer;
  font-size: 14px;
}

.cart-btn {
  background: #111827;
  color: white;
}

.buy-btn {
  background: #f59e0b;
  color: #111;
}

button.action:disabled {
  background: #ccc;
  color: #777;
  cursor: not-allowed;
}

.empty,
.loading,
.error {
  background: white;
  padding: 35px 20px;
  text-align: center;
  border-radius: 12px;
  color: #666;
  grid-column: 1 / -1;
}

.error {
  color: #dc2626;
}

.message {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #111827;
  color: white;
  padding: 13px 20px;
  border-radius: 8px;
  display: none;
  z-index: 3000;
}

@media(max-width:700px) {
  .header-top {
    flex-direction: column;
  }

  .menu {
    width: 100%;
  }

  .tools {
    grid-template-columns: 1fr;
  }

  .products {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .product-image {
    height: 160px;
  }
}

@media(max-width:430px) {
  .products {
    grid-template-columns: 1fr;
  }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

</head>

<body>

<header>
  <div class="header-top">

    <div class="logo"
         onclick="window.location.href='accueil.html'">
      Ven<span>doza</span>
    </div>

    <nav class="menu">

      <a href="accueil.html">🏠 Accueil</a>

      <a href="produits.html">🛍️ Produits</a>

      <a href="panier.html">🛒 Panier</a>

      <a href="commandes-client.html">📦 Commandes</a>

      <a href="notifications.html">
        🔔 Notifications
        <span id="notificationBadge"
              class="badge"
              style="display:none;">0</span>
      </a>

      <a id="accountLink"
         href="connexion.html">
        🔐 Connexion
      </a>

    </nav>

  </div>
</header>

<div class="container">

  <h1>🛍️ Nos Produits</h1>

  <div class="subtitle">
    Découvrez nos produits et passez votre commande facilement.
  </div>

  <div class="tools">

    <input
      type="text"
      id="search"
      placeholder="🔎 Rechercher un produit..."
    >

    <select id="categoryFilter">
      <option value="all">
        Toutes les catégories
      </option>
    </select>

    <select id="sortFilter">
      <option value="recent">Plus récents</option>
      <option value="priceAsc">Prix croissant</option>
      <option value="priceDesc">Prix décroissant</option>
      <option value="name">Nom A-Z</option>
      <option value="stock">Stock disponible</option>
    </select>

  </div>

  <div id="products" class="products">
    <div class="loading">
      ⏳ Chargement des produits...
    </div>
  </div>

</div>

<div id="message" class="message"></div>


<script>

/* =================================
   VARIABLES
================================= */

let tousLesProduits = [];


/* =================================
   CHARGER PRODUITS SUPABASE
================================= */

async function chargerProduits() {

  const container =
    document.getElementById("products");

  try {

    const resultat = await supabase
      .from("products")
      .select("*");

    const data = resultat.data;
    const error = resultat.error;

    if (error) {

      console.error("Erreur Supabase :", error);

      container.innerHTML = `
        <div class="error">
          <h3>❌ Erreur Supabase</h3>
          <p>${error.message}</p>
        </div>
      `;

      return [];

    }

    console.log("Produits Supabase :", data);

    return (data || []).map(function(produit) {

      return {

        id: produit.id,

        nom:
          produit.name || "Produit",

        prix:
          Number(produit.price) || 0,

        stock:
          Number(produit.Stock) || 0,

        image:
          produit.image || "",

        categorie:
          produit.Category || "Autres",

        description:
          produit.description || ""

      };

    });

  } catch (error) {

    console.error("Erreur connexion :", error);

    container.innerHTML = `
      <div class="error">
        <h3>❌ Impossible de charger les produits</h3>
        <p>${error.message || error}</p>
      </div>
    `;

    return [];

  }

}


/* =================================
   AFFICHER PRODUITS
================================= */

function afficherProduits() {

  const container =
    document.getElementById("products");

  let produits =
    [...tousLesProduits];

  const recherche =
    document.getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const categorie =
    document.getElementById("categoryFilter")
      .value;

  const tri =
    document.getElementById("sortFilter")
      .value;


  /* RECHERCHE */

  if (recherche) {

    produits = produits.filter(function(produit) {

      return (

        String(produit.nom)
          .toLowerCase()
          .includes(recherche)

        ||

        String(produit.description)
          .toLowerCase()
          .includes(recherche)

        ||

        String(produit.categorie)
          .toLowerCase()
          .includes(recherche)

      );

    });

  }


  /* CATÉGORIE */

  if (categorie !== "all") {

    produits = produits.filter(function(produit) {

      return produit.categorie === categorie;

    });

  }


  /* TRI */

  if (tri === "priceAsc") {

    produits.sort(function(a,b) {
      return a.prix - b.prix;
    });

  }

  if (tri === "priceDesc") {

    produits.sort(function(a,b) {
      return b.prix - a.prix;
    });

  }

  if (tri === "name") {

    produits.sort(function(a,b) {

      return String(a.nom)
        .localeCompare(String(b.nom));

    });

  }

  if (tri === "stock") {

    produits.sort(function(a,b) {

      return b.stock - a.stock;

    });

  }


  /* AUCUN PRODUIT */

  if (produits.length === 0) {

    container.innerHTML = `
      <div class="empty">
        <h3>😔 Aucun produit trouvé</h3>
        <p>Aucun produit disponible.</p>
      </div>
    `;

    return;

  }


  /* AFFICHAGE */

  container.innerHTML = "";


  produits.forEach(function(produit) {

    const card =
      document.createElement("div");

    card.className = "card";


    /* IMAGE */

    const image =
      document.createElement("img");

    image.className =
      "product-image";

    image.src =
      produit.image || "";

    image.alt =
      produit.nom;


    if (!produit.image) {
      image.style.display = "none";
    }


    /* CONTENU */

    const content =
      document.createElement("div");

    content.className = "content";


    const category =
      document.createElement("div");

    category.className = "category";

    category.textContent =
      produit.categorie;


    const name =
      document.createElement("div");

    name.className = "name";

    name.textContent =
      produit.nom;


    const description =
      document.createElement("div");

    description.className =
      "description";

    description.textContent =
      produit.description ||
      "Aucune description disponible.";


    const price =
      document.createElement("div");

    price.className = "price";

    price.textContent =
      produit.prix.toLocaleString("fr-FR") +
      " G";


    const stock =
      document.createElement("div");

    stock.className = "stock";


    if (produit.stock <= 0) {

      stock.classList.add("out");

      stock.textContent =
        "Rupture de stock";

    }

    else if (produit.stock <= 5) {

      stock.classList.add("low");

      stock.textContent =
        "Plus que " +
        produit.stock +
        " disponible(s)";

    }

    else {

      stock.classList.add("ok");

      stock.textContent =
        "Stock disponible : " +
        produit.stock;

    }


    /* BOUTONS */

    const buttons =
      document.createElement("div");

    buttons.className =
      "buttons";


    const cartButton =
      document.createElement("button");

    cartButton.className =
      "action cart-btn";

    cartButton.textContent =
      "🛒 Ajouter au panier";

    cartButton.disabled =
      produit.stock <= 0;


    cartButton.onclick =
      function() {

        ajouterAuPanier(produit);

      };


    const buyButton =
      document.createElement("button");

    buyButton.className =
      "action buy-btn";

    buyButton.textContent =
      "⚡ Acheter maintenant";

    buyButton.disabled =
      produit.stock <= 0;


    buyButton.onclick =
      function() {

        acheterMaintenant(produit);

      };


    buttons.appendChild(cartButton);
    buttons.appendChild(buyButton);


    content.appendChild(category);
    content.appendChild(name);
    content.appendChild(description);
    content.appendChild(price);
    content.appendChild(stock);
    content.appendChild(buttons);


    card.appendChild(image);
    card.appendChild(content);


    container.appendChild(card);

  });

}


/* =================================
   CATÉGORIES
================================= */

function chargerCategories() {

  const select =
    document.getElementById(
      "categoryFilter"
    );

  const categories = [];


  tousLesProduits.forEach(function(produit) {

    if (
      produit.categorie &&
      !categories.includes(produit.categorie)
    ) {

      categories.push(produit.categorie);

    }

  });


  categories.sort(function(a,b) {

    return a.localeCompare(b);

  });


  select.innerHTML =
    `<option value="all">
      Toutes les catégories
    </option>`;


  categories.forEach(function(categorie) {

    const option =
      document.createElement("option");

    option.value =
      categorie;

    option.textContent =
      categorie;

    select.appendChild(option);

  });

}


/* =================================
   PANIER
================================= */

function ajouterAuPanier(produit) {

  let panier = [];

  try {

    panier =
      JSON.parse(
        localStorage.getItem(
          "vendozaCart"
        )
      ) || [];

  } catch(e) {

    panier = [];

  }


  const id =
    String(produit.id);


  const index =
    panier.findIndex(function(article) {

      return String(article.id) === id;

    });


  if (index >= 0) {

    const quantite =
      Number(
        panier[index].quantity
      ) || 0;


    if (quantite >= produit.stock) {

      showMessage(
        "Stock maximum atteint."
      );

      return;

    }


    panier[index].quantity =
      quantite + 1;

  }

  else {

    panier.push({

      id: produit.id,

      name: produit.nom,

      price: produit.prix,

      stock: produit.stock,

      image: produit.image,

      category: produit.categorie,

      quantity: 1

    });

  }


  localStorage.setItem(
    "vendozaCart",
    JSON.stringify(panier)
  );


  showMessage(
    "Produit ajouté au panier 🛒"
  );

}


/* =================================
   ACHETER
================================= */

function acheterMaintenant(produit) {

  const achat = {

    id: produit.id,

    name: produit.nom,

    price: produit.prix,

    stock: produit.stock,

    image: produit.image,

    category: produit.categorie,

    quantity: 1

  };


  localStorage.setItem(
    "vendozaAchatDirect",
    JSON.stringify(achat)
  );


  localStorage.setItem(
    "vendozaCart",
    JSON.stringify([achat])
  );


  window.location.href =
    "commande.html";

}


/* =================================
   MESSAGE
================================= */

function showMessage(message) {

  const box =
    document.getElementById("message");

  box.textContent =
    message;

  box.style.display =
    "block";


  setTimeout(function() {

    box.style.display =
      "none";

  }, 2200);

}


/* =================================
   COMPTE
================================= */

function actualiserCompte() {

  const link =
    document.getElementById(
      "accountLink"
    );

  let utilisateur = null;


  try {

    utilisateur =
      JSON.parse(
        localStorage.getItem(
          "vendozaUtilisateurConnecte"
        )
      );

  } catch(e) {

    utilisateur = null;

  }


  if (utilisateur) {

    link.href =
      "mon-compte.html";

    link.textContent =
      "👤 Mon compte";

  }

}


/* =================================
   INITIALISATION
================================= */

async function initialiser() {

  const container =
    document.getElementById("products");


  container.innerHTML = `
    <div class="loading">
      ⏳ Chargement des produits...
    </div>
  `;


  tousLesProduits =
    await chargerProduits();


  chargerCategories();

  afficherProduits();

  actualiserCompte();

}


/* =================================
   FILTRES
================================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    afficherProduits
  );


document
  .getElementById("categoryFilter")
  .addEventListener(
    "change",
    afficherProduits
  );


document
  .getElementById("sortFilter")
  .addEventListener(
    "change",
    afficherProduits
  );


/* LANCER */

initialiser();

</script>

</body>
</html>
