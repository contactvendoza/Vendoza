<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Supabase - Vendoza</title>
</head>

<body style="font-family: Arial; padding: 20px;">

  <h1>Vendoza</h1>
  <h2>Test de connexion Supabase</h2>

  <p id="message">Vérification en cours...</p>

  <!-- Charger la bibliothèque Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://kzrphvyhkbuhaczmnjgk.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_ZvVK-d8qoaqi4__K0cqoyg_IsCaAqPO";

    const message = document.getElementById("message");

    async function testerSupabase() {
      try {
        if (!window.supabase) {
          throw new Error(
            "La bibliothèque Supabase ne s'est pas chargée. Vérifie ta connexion Internet."
          );
        }

        const client = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY
        );

        message.textContent =
          "Bibliothèque chargée. Test de la base de données...";

        const { data, error } = await client
          .from("products")
          .select("id")
          .limit(1);

        if (error) {
          message.textContent =
            "Erreur de base de données : " + error.message;
          return;
        }

        message.textContent =
          "✅ Supabase fonctionne ! La connexion est réussie.";

        console.log("Résultat :", data);

      } catch (erreur) {
        message.textContent =
          "❌ Erreur : " + erreur.message;

        console.error("Erreur Supabase :", erreur);
      }
    }

    testerSupabase();
  </script>

</body>
</html>
