<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vendoza - Mes Favoris</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f6fa;
  color: #222;
}

header {
  background: #111827;
  color: white;
  padding: 14px 18px;
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 2px 10px rgba(0,0,0,.15);
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  cursor: pointer;
}

.logo span {
  color: #f59e0b;
}

.menu {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  justify-content: center;
}

.menu a {
  color: white;
  text-decoration: none;
  font-size: 14px;
  padding: 8px 10px;
  border-radius: 7px;
}

.menu a:hover {
  background: #374151;
}

.badge {
  background: #ef4444;
  color: white;
  border-radius: 50%;
  min-width: 19px;
  height: 19px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  margin-left: 3px;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 25px 15px 50px;
}

h1 {
  text-align: center;
  margin: 5px 0 8px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 18px;
}

.card {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
  position: relative;
}

.product-image {
  width: 100%;
  height: 210px;
  object-fit: cover;
  display: block;
  background: #eee;
}

.content {
  padding: 15px;
}

.category {
  color: #777;
  font-size: 13px;
  margin-bottom: 5px;
}

.name {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 8px;
}

.description {
  color: #666;
  font-size: 14px;
  line-height: 1.4;
  min-height: 40px;
}

.price {
  font-size: 20px;
  font-weight: bold;
  margin: 12px 0 5px;
}

.stock {
  font-size: 13px;
  margin-bottom: 12px;
}

.stock-ok {
  color: #15803d;
}

.stock-low {
  color: #d97706;
}

.stock-out {
  color: #dc2626;
}

.buttons {
  display: grid;
  gap: 8px;
}

.action {
  width: 100%;
  border: none;
  border-radius: 8px;
  padding: 11px;
  font-weight: bold;
  cursor: pointer;
  font-size: 14px;
}

.cart-btn {
  background: #111827;
  color: white;
}

.buy-btn {
  background: #f59e0b;
  color: #111;
}

.remove-btn {
  background: #fee2e2;
  color: #b91c1c;
}

.action:disabled {
  background: #ccc;
  color: #777;
  cursor: not-allowed;
}

.empty {
  background: white;
  padding: 45px 20px;
  border-radius: 14px;
  text-align: center;
  box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

.empty-icon {
  font-size: 55px;
  margin-bottom: 10px;
}

.empty h2 {
  margin-bottom: 8px;
}

.empty p {
  color: #666;
}

.shop-btn {
  display: inline-block;
  margin-top: 15px;
  padding: 12px 20px;
  background: #111827;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  font-weight: bold;
}

.message {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #111827;
  color: white;
  padding: 13px 20px;
  border-radius: 8px;
  display: none;
  z-index: 3000;
  box-shadow: 0 3px 12px rgba(0,0,0,.2);
}

@media(max-width:700px) {
  .header-top {
    flex-direction: column;
  }

  .menu {
    width: 100%;
  }

  .products {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .product-image {
    height: 160px;
  }

  .content {
    padding: 10px;
  }

  .name {
    font-size: 16px;
  }

  .price {
    font-size: 18px;
  }
}

@media(max-width:430px) {
  .products {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-top">

    <div
      class="logo"
      onclick="window.location.href='accueil.html'"
    >
      Ven<span>doza</span>
    </div>

    <nav class="menu">

      <a href="accueil.html">
        🏠 Accueil
      </a>

      <a href="produits.html">
        🛍️ Produits
      </a>

      <a href="panier.html">
        🛒 Panier
      </a>

      <a href="favoris.html">
        ❤️ Favoris
      </a>

      <!-- CORRIGÉ -->
      <a href="commandes-client.html">
        📦 Commandes
      </a>

      <a href="notifications.html">
        🔔 Notifications
        <span
          id="notificationBadge"
          class="badge"
          style="display:none;"
        >
          0
        </span>
      </a>

      <a
        id="accountLink"
        href="connexion.html"
      >
        🔐 Connexion
      </a>

    </nav>

  </div>
</header>

<div class="container">

  <h1>❤️ Mes Favoris</h1>

  <div class="subtitle">
    Retrouvez ici les produits que vous aimez.
  </div>

  <div
    id="products"
    class="products"
  ></div>

</div>

<div
  id="message"
  class="message"
></div>

<script>

function normaliserId(id) {
  return String(id);
}

function getProduits() {

  try {

    const data =
      localStorage.getItem("produitsVendoza");

    const produits =
      data ? JSON.parse(data) : [];

    return Array.isArray(produits)
      ? produits
      : [];

  } catch(e) {

    return [];

  }
}

function getFavoris() {

  try {

    const data =
      localStorage.getItem("vendozaFavoris");

    const favoris =
      data ? JSON.parse(data) : [];

    if (!Array.isArray(favoris)) {
      return [];
    }

    return favoris.map(function(id) {
      return normaliserId(id);
    });

  } catch(e) {

    return [];

  }
}

function getCart() {

  try {

    const data =
      localStorage.getItem("vendozaCart");

    const cart =
      data ? JSON.parse(data) : [];

    return Array.isArray(cart)
      ? cart
      : [];

  } catch(e) {

    return [];

  }
}

function showMessage(message) {

  const box =
    document.getElementById("message");

  box.textContent = message;
  box.style.display = "block";

  setTimeout(function() {
    box.style.display = "none";
  }, 2200);
}


/* ================================
   COMPTE
================================ */

function getUtilisateurConnecte() {

  try {

    const data =
      localStorage.getItem(
        "vendozaUtilisateurConnecte"
      );

    return data
      ? JSON.parse(data)
      : null;

  } catch(e) {

    return null;

  }
}

function actualiserCompte() {

  const utilisateur =
    getUtilisateurConnecte();

  const link =
    document.getElementById("accountLink");

  if (utilisateur) {

    link.href =
      "mon-compte.html";

    link.textContent =
      "👤 Mon compte";

  } else {

    link.href =
      "connexion.html";

    link.textContent =
      "🔐 Connexion";

  }
}


/* ================================
   NOTIFICATIONS
================================ */

function actualiserNotifications() {

  const utilisateur =
    getUtilisateurConnecte();

  const badge =
    document.getElementById(
      "notificationBadge"
    );

  if (!utilisateur) {

    badge.style.display = "none";
    return;

  }

  let commandes = [];

  try {

    commandes =
      JSON.parse(
        localStorage.getItem(
          "vendozaCommandes"
        )
      ) || [];

  } catch(e) {

    commandes = [];

  }

  let lues = [];

  try {

    lues =
      JSON.parse(
        localStorage.getItem(
          "vendozaNotificationsLues"
        )
      ) || [];

  } catch(e) {

    lues = [];

  }

  const email =
    String(
      utilisateur.email || ""
    ).toLowerCase();

  const telephone =
    String(
      utilisateur.telephone || ""
    );

  let nombre = 0;

  commandes.forEach(function(commande) {

    const client =
      commande.client || {};

    const commandeEmail =
      String(
        client.email || ""
      ).toLowerCase();

    const commandeTelephone =
      String(
        client.telephone || ""
      );

    const appartient =
      (
        email &&
        commandeEmail &&
        email === commandeEmail
      )
      ||
      (
        telephone &&
        commandeTelephone &&
        telephone === commandeTelephone
      );

    if (!appartient) {
      return;
    }

    const notificationId =
      normaliserId(
        commande.id +
        "-" +
        commande.statut
      );

    const dejaLue =
      lues
        .map(String)
        .includes(notificationId);

    if (!dejaLue) {
      nombre++;
    }

  });

  if (nombre > 0) {

    badge.textContent =
      nombre;

    badge.style.display =
      "inline-flex";

  } else {

    badge.style.display =
      "none";

  }
}


/* ================================
   RETIRER FAVORI
================================ */

function retirerFavori(id) {

  id =
    normaliserId(id);

  let favoris =
    getFavoris();

  favoris =
    favoris.filter(function(favoriId) {

      return normaliserId(favoriId) !== id;

    });

  localStorage.setItem(
    "vendozaFavoris",
    JSON.stringify(favoris)
  );

  showMessage(
    "Produit retiré des favoris ❤️"
  );

  afficherFavoris();
}


/* ================================
   AJOUTER AU PANIER
================================ */

function ajouterAuPanier(id) {

  id =
    normaliserId(id);

  const produits =
    getProduits();

  const produit =
    produits.find(function(item) {

      return normaliserId(item.id) === id;

    });

  if (!produit) {

    showMessage(
      "Produit introuvable."
    );

    return;

  }

  const stock =
    Number(produit.stock) || 0;

  if (stock <= 0) {

    showMessage(
      "Ce produit est en rupture de stock."
    );

    return;

  }

  let panier =
    getCart();

  panier =
    panier.map(function(article) {

      return {
        ...article,
        id: normaliserId(article.id)
      };

    });

  const index =
    panier.findIndex(function(article) {

      return normaliserId(article.id) === id;

    });

  if (index >= 0) {

    const quantite =
      Number(
        panier[index].quantity
      ) || 0;

    if (quantite >= stock) {

      showMessage(
        "Stock maximum atteint."
      );

      return;

    }

    panier[index].quantity =
      quantite + 1;

  } else {

    panier.push({

      id: id,

      name:
        produit.nom || "Produit",

      price:
        Number(produit.prix) || 0,

      stock:
        stock,

      image:
        produit.image || "",

      category:
        produit.categorie || "Autres",

      quantity: 1

    });

  }

  localStorage.setItem(
    "vendozaCart",
    JSON.stringify(panier)
  );

  showMessage(
    "Produit ajouté au panier 🛒"
  );
}


/* ================================
   ACHETER MAINTENANT
================================ */

function acheterMaintenant(id) {

  id =
    normaliserId(id);

  const produits =
    getProduits();

  const produit =
    produits.find(function(item) {

      return normaliserId(item.id) === id;

    });

  if (!produit) {

    showMessage(
      "Produit introuvable."
    );

    return;

  }

  const stock =
    Number(produit.stock) || 0;

  if (stock <= 0) {

    showMessage(
      "Ce produit est en rupture de stock."
    );

    return;

  }

  const achatDirect = {

    id: id,

    name:
      produit.nom || "Produit",

    price:
      Number(produit.prix) || 0,

    stock:
      stock,

    image:
      produit.image || "",

    category:
      produit.categorie || "Autres",

    quantity: 1

  };

  localStorage.setItem(
    "vendozaAchatDirect",
    JSON.stringify(achatDirect)
  );

  localStorage.setItem(
    "vendozaCart",
    JSON.stringify([
      achatDirect
    ])
  );

  window.location.href =
    "commande.html";
}


/* ================================
   AFFICHER FAVORIS
================================ */

function afficherFavoris() {

  const container =
    document.getElementById(
      "products"
    );

  const produits =
    getProduits();

  const favoris =
    getFavoris();

  const produitsFavoris =
    produits.filter(function(produit) {

      const id =
        normaliserId(produit.id);

      return favoris.some(function(favoriId) {

        return normaliserId(favoriId) === id;

      });

    });

  if (produitsFavoris.length === 0) {

    container.innerHTML = `

      <div
        class="empty"
        style="grid-column:1/-1;"
      >

        <div class="empty-icon">
          ❤️
        </div>

        <h2>
          Aucun favori pour le moment
        </h2>

        <p>
          Ajoutez vos produits préférés
          depuis la boutique.
        </p>

        <a
          href="produits.html"
          class="shop-btn"
        >
          🛍️ Voir les produits
        </a>

      </div>

    `;

    return;
  }

  container.innerHTML = "";

  produitsFavoris.forEach(function(produit) {

    const id =
      normaliserId(produit.id);

    const nom =
      produit.nom ||
      "Produit sans nom";

    const prix =
      Number(produit.prix) || 0;

    const stock =
      Number(produit.stock) || 0;

    const categorie =
      produit.categorie ||
      "Autres";

    const description =
      produit.description ||
      "Aucune description disponible.";

    const image =
      produit.image || "";

    let stockClass =
      "stock-ok";

    let stockText =
      "Stock disponible : " +
      stock;

    if (stock <= 0) {

      stockClass =
        "stock-out";

      stockText =
        "Rupture de stock";

    } else if (stock <= 5) {

      stockClass =
        "stock-low";

      stockText =
        "Plus que " +
        stock +
        " disponible(s)";

    }

    const card =
      document.createElement("div");

    card.className =
      "card";

    const imageElement =
      document.createElement("img");

    imageElement.className =
      "product-image";

    imageElement.src =
      image;

    imageElement.alt =
      nom;

    imageElement.onerror =
      function() {

        this.style.display =
          "none";

      };

    const content =
      document.createElement("div");

    content.className =
      "content";

    const categoryDiv =
      document.createElement("div");

    categoryDiv.className =
      "category";

    categoryDiv.textContent =
      categorie;

    const nameDiv =
      document.createElement("div");

    nameDiv.className =
      "name";

    nameDiv.textContent =
      nom;

    const descriptionDiv =
      document.createElement("div");

    descriptionDiv.className =
      "description";

    descriptionDiv.textContent =
      description;

    const priceDiv =
      document.createElement("div");

    priceDiv.className =
      "price";

    priceDiv.textContent =
      prix.toLocaleString(
        "fr-FR"
      ) +
      " G";

    const stockDiv =
      document.createElement("div");

    stockDiv.className =
      "stock " +
      stockClass;

    stockDiv.textContent =
      stockText;

    const buttons =
      document.createElement("div");

    buttons.className =
      "buttons";

    const cartButton =
      document.createElement("button");

    cartButton.className =
      "action cart-btn";

    cartButton.type =
      "button";

    cartButton.textContent =
      "🛒 Ajouter au panier";

    cartButton.disabled =
      stock <= 0;

    cartButton.addEventListener(
      "click",
      function() {

        ajouterAuPanier(id);

      }
    );

    const buyButton =
      document.createElement("button");

    buyButton.className =
      "action buy-btn";

    buyButton.type =
      "button";

    buyButton.textContent =
      "⚡ Acheter maintenant";

    buyButton.disabled =
      stock <= 0;

    buyButton.addEventListener(
      "click",
      function() {

        acheterMaintenant(id);

      }
    );

    const removeButton =
      document.createElement("button");

    removeButton.className =
      "action remove-btn";

    removeButton.type =
      "button";

    removeButton.textContent =
      "❤️ Retirer des favoris";

    removeButton.addEventListener(
      "click",
      function() {

        retirerFavori(id);

      }
    );

    buttons.appendChild(
      cartButton
    );

    buttons.appendChild(
      buyButton
    );

    buttons.appendChild(
      removeButton
    );

    content.appendChild(
      categoryDiv
    );

    content.appendChild(
      nameDiv
    );

    content.appendChild(
      descriptionDiv
    );

    content.appendChild(
      priceDiv
    );

    content.appendChild(
      stockDiv
    );

    content.appendChild(
      buttons
    );

    card.appendChild(
      imageElement
    );

    card.appendChild(
      content
    );

    container.appendChild(
      card
    );

  });
}


/* ================================
   INITIALISATION
================================ */

function initialiser() {

  actualiserCompte();

  actualiserNotifications();

  afficherFavoris();

}

initialiser();


/* ================================
   SYNCHRONISATION
================================ */

window.addEventListener(
  "storage",
  function() {

    actualiserCompte();

    actualiserNotifications();

    afficherFavoris();

  }
);

setInterval(
  function() {

    actualiserCompte();

    actualiserNotifications();

    afficherFavoris();

  },
  3000
);

</script>

</body>
</html>
