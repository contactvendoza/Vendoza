<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vendoza - Connexion</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 92%;
      max-width: 420px;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }

    .success {
      display: block !important;
      background: #e8f7e8;
      color: #176b17;
    }

    .error {
      display: block !important;
      background: #ffe8e8;
      color: #a00000;
    }

    .info {
      display: block !important;
      background: #e8f1ff;
      color: #174a8b;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Connexion Vendoza</h1>

  <input
    type="email"
    id="email"
    placeholder="Votre adresse Gmail"
    autocomplete="email"
  >

  <input
    type="password"
    id="password"
    placeholder="Votre mot de passe"
    autocomplete="current-password"
  >

  <button id="loginBtn" onclick="connexion()">
    Se connecter
  </button>

  <div id="message"></div>

</div>

<script>

function afficher(message, type) {
  const box = document.getElementById("message");

  box.textContent = message;
  box.className = type;
}


// Vérification du chargement de Supabase
window.addEventListener("load", function() {

  if (typeof supabase === "undefined") {
    afficher(
      "ERREUR : Supabase n'est pas chargé.\n\nVérifie que supabase-config.js existe bien et que son nom est exactement le même.",
      "error"
    );
    return;
  }

  afficher(
    "Supabase est correctement chargé. Tu peux essayer de te connecter.",
    "info"
  );

});


async function connexion() {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const bouton = document.getElementById("loginBtn");

  if (!email || !password) {

    afficher(
      "Entre ton adresse email et ton mot de passe.",
      "error"
    );

    return;
  }

  bouton.disabled = true;
  bouton.textContent = "Connexion...";

  afficher(
    "Étape 1 : connexion à Supabase Auth...",
    "info"
  );


  try {

    // ==========================================
    // ÉTAPE 1 : CONNEXION SUPABASE AUTH
    // ==========================================

    const resultatAuth = await supabase.auth.signInWithPassword({
      email: email,
      password: password
    });

    const data = resultatAuth.data;
    const error = resultatAuth.error;


    if (error) {

      afficher(
        "ERREUR SUPABASE AUTH\n\n" +
        "Message : " + error.message + "\n" +
        "Code : " + (error.code || "non disponible") + "\n" +
        "Status : " + (error.status || "non disponible"),
        "error"
      );

      bouton.disabled = false;
      bouton.textContent = "Se connecter";

      return;
    }


    if (!data || !data.user) {

      afficher(
        "ERREUR : Supabase n'a pas retourné l'utilisateur.",
        "error"
      );

      bouton.disabled = false;
      bouton.textContent = "Se connecter";

      return;
    }


    const userId = data.user.id;


    afficher(
      "Étape 1 réussie ✅\n\n" +
      "Utilisateur connecté.\n\n" +
      "User ID : " + userId +
      "\n\nÉtape 2 : recherche du profil...",
      "info"
    );


    // ==========================================
    // ÉTAPE 2 : RECHERCHE DU PROFIL
    // ==========================================

    const resultatProfile = await supabase
      .from("profiles")
      .select("*")
      .eq("id", userId)
      .maybeSingle();


    const profile = resultatProfile.data;
    const profileError = resultatProfile.error;


    if (profileError) {

      afficher(
        "ERREUR PROFILES\n\n" +
        "Message : " + profileError.message + "\n\n" +
        "Code : " + (profileError.code || "non disponible") + "\n\n" +
        "Details : " + (profileError.details || "non disponible") + "\n\n" +
        "Hint : " + (profileError.hint || "non disponible"),
        "error"
      );

      bouton.disabled = false;
      bouton.textContent = "Se connecter";

      return;
    }


    if (!profile) {

      afficher(
        "AUTH RÉUSSI ✅\n\n" +
        "Mais aucun profil n'a été trouvé dans la table profiles.\n\n" +
        "User ID recherché : " + userId,
        "error"
      );

      bouton.disabled = false;
      bouton.textContent = "Se connecter";

      return;
    }


    // ==========================================
    // ÉTAPE 3 : AFFICHER LE PROFIL
    // ==========================================

    afficher(
      "Tout fonctionne jusqu'ici ✅\n\n" +
      "User ID : " + userId +
      "\n\n" +
      "Profil trouvé : OUI\n\n" +
      "Nom : " + (profile.name || "non défini") +
      "\n\n" +
      "Role : " + (profile.role || "non défini") +
      "\n\n" +
      "Redirection en cours...",
      "success"
    );


    // ==========================================
    // ÉTAPE 4 : REDIRECTION SELON LE ROLE
    // ==========================================

    const role = String(profile.role || "").toLowerCase().trim();


    setTimeout(function() {

      if (role === "admin") {

        window.location.href = "dashboard.html";

      } else if (role === "client") {

        window.location.href = "produits.html";

      } else if (role === "vendeur") {

        window.location.href = "dashboard.html";

      } else {

        afficher(
          "Connexion réussie, mais le rôle est inconnu.\n\n" +
          "Rôle trouvé : " + profile.role,
          "error"
        );

        bouton.disabled = false;
        bouton.textContent = "Se connecter";
      }

    }, 1200);


  } catch (e) {

    afficher(
      "ERREUR JAVASCRIPT\n\n" +
      "Message : " + (e.message || e) +
      "\n\n" +
      "Vérifie le message ci-dessus.",
      "error"
    );

    bouton.disabled = false;
    bouton.textContent = "Se connecter";

  }

}

</script>

</body>
</html>
