<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Vendoza</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #172554;
      margin-bottom: 8px;
    }

    .logo span {
      color: #f59e0b;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #172554;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 8px;
      background: #172554;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .error {
      display: block;
      color: #991b1b;
      background: #fee2e2;
    }

    .success {
      display: block;
      color: #166534;
      background: #dcfce7;
    }

    .links {
      margin-top: 20px;
      text-align: center;
      line-height: 2;
    }

    a {
      color: #1d4ed8;
      text-decoration: none;
    }

    .back {
      display: block;
      margin-top: 18px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">Ven<span>doza</span></div>

    <h2>Konekte sou kont ou</h2>

    <form id="loginForm">

      <label for="email">Adrès imel</label>

      <input
        type="email"
        id="email"
        placeholder="Antre imel ou"
        autocomplete="email"
        required
      >

      <label for="password">Modpas</label>

      <input
        type="password"
        id="password"
        placeholder="Antre modpas ou"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Konekte
      </button>

    </form>

    <div id="message" class="message" role="status"></div>

    <div class="links">
      <a href="inscription.html">Kreye yon kont</a>
    </div>

    <a class="back" href="produits.html">
      ← Retounen nan pwodwi yo
    </a>

  </div>

  <script>
    // KONFIGIRASYON SUPABASE

    const SUPABASE_URL =
      "https://kzrphvyhkbuhaczmnjgk.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_ZvVK-d8qoaqi4__K0cqoyg_IsCaAqPO";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    function afficherMessage(texte, type) {
      message.textContent = texte;
      message.className = "message " + type;
    }

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginButton.disabled = true;
      loginButton.textContent = "Koneksyon an ap fèt...";
      message.className = "message";

      try {

        // 1. KONEKTE AK KONT SUPABASE LA

        const { data, error } = await client.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          throw new Error(
            "Koneksyon an echwe: " + error.message
          );
        }

        if (!data.user) {
          throw new Error(
            "Nou pa jwenn enfòmasyon itilizatè a."
          );
        }

        // 2. CHÈCHE PWOFIL LA AVÈK KOLÒN ID

        const { data: profil, error: erreurProfil } = await client
          .from("profiles")
          .select("*")
          .eq("id", data.user.id)
          .maybeSingle();

        if (erreurProfil) {
          throw new Error(
            "Koneksyon reyisi, men gen yon erè nan pwofil la: " +
            erreurProfil.message
          );
        }

        if (!profil) {
          throw new Error(
            "Kont lan konekte, men nou pa jwenn pwofil ki koresponn ak ID sa a. Verifye ID a ak RLS policies yo nan Supabase."
          );
        }

        // 3. LI WÒL ITILIZATÈ A

        const role = String(
          profil.admin || profil.role || ""
        ).trim().toLowerCase();

        const utilisateur = {
          id: data.user.id,
          email: data.user.email,
          role: role
        };

        localStorage.setItem(
          "v endozaUtilisateurConnecte".replace(" ", ""),
          JSON.stringify(utilisateur)
        );

        afficherMessage(
          "Koneksyon reyisi! N ap ouvri paj ou a...",
          "success"
        );

        // 4. REDIREKSYON SELON WÒL LA

        setTimeout(function() {

          if (
            role === "admin" ||
            role === "administrateur"
          ) {
            window.location.href = "dashboard.html";

          } else if (
            role === "vendeur" ||
            role === "seller"
          ) {
            window.location.href = "dashboard-vendeur.html";

          } else if (
            role === "client" ||
            role === "user"
          ) {
            window.location.href = "produits.html";

          } else {
            afficherMessage(
              "Koneksyon reyisi, men valè wòl la pa rekonèt. Valè kolòn admin lan: " +
              (role || "vid") +
              ".",
              "error"
            );

            loginButton.disabled = false;
            loginButton.textContent = "Konekte";
          }

        }, 1200);

      } catch (error) {

        afficherMessage(error.message, "error");

        loginButton.disabled = false;
        loginButton.textContent = "Konekte";

      }
    });
  </script>

</body>
  </html>
