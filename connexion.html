<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vendoza - Connexion</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo h1 {
      margin: 0;
      font-size: 34px;
    }

    .logo p {
      margin-top: 8px;
      color: #777;
    }

    .box {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
      border-bottom: 1px solid #ddd;
    }

    .tab {
      width: 50%;
      padding: 13px;
      border: none;
      background: transparent;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      color: #777;
    }

    .tab.active {
      color: #111;
      border-bottom: 3px solid #111;
    }

    .formulaire {
      display: none;
    }

    .formulaire.active {
      display: block;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 7px;
      text-align: center;
      display: none;
      font-size: 14px;
    }

    .success {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .error {
      background: #ffebee;
      color: #c62828;
    }

    .retour {
      text-align: center;
      margin-top: 20px;
    }

    .retour a {
      color: #111;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>🛍️ Vendoza</h1>
    <p>Bienvenue dans votre boutique en ligne</p>
  </div>

  <div class="box">

    <div class="tabs">

      <button
        class="tab active"
        onclick="afficherFormulaire('connexion', this)"
      >
        Se connecter
      </button>

      <button
        class="tab"
        onclick="afficherFormulaire('inscription', this)"
      >
        Créer un compte
      </button>

    </div>


    <!-- ========================= -->
    <!-- CONNEXION -->
    <!-- ========================= -->

    <form id="connexion" class="formulaire active">

      <label>Email</label>

      <input
        type="email"
        id="emailConnexion"
        placeholder="Votre adresse email"
        required
      >

      <label>Mot de passe</label>

      <input
        type="password"
        id="passwordConnexion"
        placeholder="Votre mot de passe"
        required
      >

      <button type="submit" class="btn">
        🔐 Se connecter
      </button>

    </form>


    <!-- ========================= -->
    <!-- INSCRIPTION -->
    <!-- ========================= -->

    <form id="inscription" class="formulaire">

      <label>Nom complet</label>

      <input
        type="text"
        id="nomInscription"
        placeholder="Votre nom complet"
        required
      >

      <label>Téléphone</label>

      <input
        type="tel"
        id="telephoneInscription"
        placeholder="Votre numéro de téléphone"
        required
      >

      <label>Email</label>

      <input
        type="email"
        id="emailInscription"
        placeholder="Votre adresse email"
        required
      >

      <label>Mot de passe</label>

      <input
        type="password"
        id="passwordInscription"
        placeholder="Créer un mot de passe"
        minlength="6"
        required
      >

      <label>Confirmer le mot de passe</label>

      <input
        type="password"
        id="confirmationPassword"
        placeholder="Confirmer votre mot de passe"
        minlength="6"
        required
      >

      <button type="submit" class="btn">
        👤 Créer mon compte
      </button>

    </form>


    <div id="message" class="message"></div>

  </div>

  <div class="retour">
    <a href="produits.html">
      ← Retour aux produits
    </a>
  </div>

</div>


<script>

  /* =========================
     CHANGER DE FORMULAIRE
  ========================= */

  function afficherFormulaire(nom, bouton) {

    document.querySelectorAll(".formulaire").forEach(form => {
      form.classList.remove("active");
    });

    document.querySelectorAll(".tab").forEach(tab => {
      tab.classList.remove("active");
    });

    document.getElementById(nom).classList.add("active");

    bouton.classList.add("active");

    cacherMessage();
  }


  /* =========================
     MESSAGE
  ========================= */

  function afficherMessage(texte, type) {

    const message = document.getElementById("message");

    message.textContent = texte;

    message.className = "message " + type;

    message.style.display = "block";
  }


  function cacherMessage() {

    const message = document.getElementById("message");

    message.style.display = "none";
  }


  /* =========================
     INSCRIPTION CLIENT
  ========================= */

  document
    .getElementById("inscription")
    .addEventListener("submit", async function(e) {

      e.preventDefault();

      const nom =
        document
          .getElementById("nomInscription")
          .value
          .trim();

      const telephone =
        document
          .getElementById("telephoneInscription")
          .value
          .trim();

      const email =
        document
          .getElementById("emailInscription")
          .value
          .trim()
          .toLowerCase();

      const password =
        document.getElementById("passwordInscription").value;

      const confirmation =
        document.getElementById("confirmationPassword").value;


      /* Vérification mot de passe */

      if (password !== confirmation) {

        afficherMessage(
          "❌ Les mots de passe ne correspondent pas.",
          "error"
        );

        return;
      }


      try {

        afficherMessage(
          "⏳ Création de votre compte...",
          "success"
        );


        /* =========================
           SUPABASE AUTH
        ========================= */

        const { data, error } =
          await supabase.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {
                name: nom,
                telephone: telephone
              }

            }

          });


        if (error) {

          console.error(error);

          afficherMessage(
            "❌ " + error.message,
            "error"
          );

          return;
        }


        if (!data.user) {

          afficherMessage(
            "❌ Impossible de créer le compte.",
            "error"
          );

          return;
        }


        /* =========================
           CRÉER LE PROFIL
        ========================= */

        const { error: profileError } =
          await supabase
            .from("profiles")
            .insert({

              id: data.user.id,

              name: nom,

              role: "client"

            });


        if (profileError) {

          console.error(profileError);

          afficherMessage(
            "❌ Compte créé mais erreur avec le profil : " +
            profileError.message,
            "error"
          );

          return;
        }


        /* =========================
           SAUVEGARDE LOCALE
           POUR LES ANCIENNES PAGES
        ========================= */

        const utilisateur = {

          id: data.user.id,

          nom: nom,

          telephone: telephone,

          email: email,

          role: "client"

        };


        localStorage.setItem(
          "vendozaUtilisateurConnecte",
          JSON.stringify(utilisateur)
        );


        /* =========================
           REDIRECTION
        ========================= */

        if (data.session) {

          afficherMessage(
            "✅ Compte créé avec succès ! Redirection...",
            "success"
          );

          setTimeout(function() {

            window.location.href = "produits.html";

          }, 1200);

        } else {

          afficherMessage(
            "✅ Compte créé ! Vérifiez votre email pour confirmer votre compte.",
            "success"
          );

        }

      } catch (e) {

        console.error(e);

        afficherMessage(
          "❌ Une erreur est survenue. Réessayez.",
          "error"
        );

      }

    });


  /* =========================
     CONNEXION CLIENT
  ========================= */

  document
    .getElementById("connexion")
    .addEventListener("submit", async function(e) {

      e.preventDefault();


      const email =
        document
          .getElementById("emailConnexion")
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById("passwordConnexion")
          .value;


      try {

        afficherMessage(
          "⏳ Connexion...",
          "success"
        );


        /* =========================
           SUPABASE AUTH LOGIN
        ========================= */

        const { data, error } =
          await supabase.auth.signInWithPassword({

            email: email,

            password: password

          });


        if (error) {

          console.error(error);

          afficherMessage(
            "❌ Email ou mot de passe incorrect.",
            "error"
          );

          return;
        }


        if (!data.user) {

          afficherMessage(
            "❌ Impossible de récupérer votre compte.",
            "error"
          );

          return;
        }


        /* =========================
           RÉCUPÉRER LE PROFIL
        ========================= */

        const { data: profile, error: profileError } =
          await supabase
            .from("profiles")
            .select("id, name, role")
            .eq("id", data.user.id)
            .single();


        if (profileError) {

          console.error(profileError);

          afficherMessage(
            "❌ Profil utilisateur introuvable.",
            "error"
          );

          return;
        }


        /* =========================
           VÉRIFICATION DU RÔLE
        ========================= */

        if (profile.role !== "client") {

          afficherMessage(
            "❌ Ce compte n'est pas un compte client.",
            "error"
          );

          await supabase.auth.signOut();

          return;
        }


        /* =========================
           SAUVEGARDE POUR VENDOZA
        ========================= */

        const utilisateur = {

          id: data.user.id,

          nom: profile.name || data.user.email,

          telephone:
            data.user.user_metadata?.telephone || "",

          email: data.user.email,

          role: profile.role

        };


        localStorage.setItem(
          "vendozaUtilisateurConnecte",
          JSON.stringify(utilisateur)
        );


        /* =========================
           SUCCÈS
        ========================= */

        afficherMessage(
          "✅ Connexion réussie ! Redirection...",
          "success"
        );


        setTimeout(function() {

          window.location.href = "produits.html";

        }, 1000);


      } catch (e) {

        console.error(e);

        afficherMessage(
          "❌ Une erreur est survenue. Réessayez.",
          "error"
        );

      }

    });

</script>

</body>
</html>
