<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendoza - Connexion</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo h1 {
      margin: 0;
      font-size: 34px;
    }

    .logo p {
      margin-top: 8px;
      color: #777;
    }

    .box {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
      border-bottom: 1px solid #ddd;
    }

    .tab {
      width: 50%;
      padding: 13px;
      border: none;
      background: transparent;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      color: #777;
    }

    .tab.active {
      color: #111;
      border-bottom: 3px solid #111;
    }

    .formulaire {
      display: none;
    }

    .formulaire.active {
      display: block;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 7px;
      text-align: center;
      display: none;
      font-size: 14px;
    }

    .success {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .error {
      background: #ffebee;
      color: #c62828;
    }

    .retour {
      text-align: center;
      margin-top: 20px;
    }

    .retour a {
      color: #111;
      text-decoration: none;
      font-weight: bold;
    }
  </style></head><body><div class="container">  <div class="logo">
    <h1>🛍️ Vendoza</h1>
    <p>Bienvenue dans votre boutique en ligne</p>
  </div>  <div class="box"><div class="tabs">
  <button class="tab active" onclick="afficherFormulaire('connexion', this)">
    Se connecter
  </button>

  <button class="tab" onclick="afficherFormulaire('inscription', this)">
    Créer un compte
  </button>
</div>

<!-- CONNEXION -->
<form id="connexion" class="formulaire active">

  <label>Email</label>
  <input
    type="email"
    id="emailConnexion"
    placeholder="Votre adresse email"
    required
  >

  <label>Mot de passe</label>
  <input
    type="password"
    id="passwordConnexion"
    placeholder="Votre mot de passe"
    required
  >

  <button type="submit" class="btn">
    🔐 Se connecter
  </button>

</form>

<!-- INSCRIPTION -->
<form id="inscription" class="formulaire">

  <label>Nom complet</label>
  <input
    type="text"
    id="nomInscription"
    placeholder="Votre nom complet"
    required
  >

  <label>Téléphone</label>
  <input
    type="tel"
    id="telephoneInscription"
    placeholder="Votre numéro de téléphone"
    required
  >

  <label>Email</label>
  <input
    type="email"
    id="emailInscription"
    placeholder="Votre adresse email"
    required
  >

  <label>Mot de passe</label>
  <input
    type="password"
    id="passwordInscription"
    placeholder="Créer un mot de passe"
    minlength="6"
    required
  >

  <label>Confirmer le mot de passe</label>
  <input
    type="password"
    id="confirmationPassword"
    placeholder="Confirmer votre mot de passe"
    minlength="6"
    required
  >

  <button type="submit" class="btn">
    👤 Créer mon compte
  </button>

</form>

<div id="message" class="message"></div>

  </div>  <div class="retour">
    <a href="produits.html">← Retour aux produits</a>
  </div></div><script>

  function afficherFormulaire(nom, bouton) {

    document.querySelectorAll(".formulaire").forEach(form => {
      form.classList.remove("active");
    });

    document.querySelectorAll(".tab").forEach(tab => {
      tab.classList.remove("active");
    });

    document.getElementById(nom).classList.add("active");
    bouton.classList.add("active");

    cacherMessage();
  }

  function afficherMessage(texte, type) {

    const message = document.getElementById("message");

    message.textContent = texte;
    message.className = "message " + type;
    message.style.display = "block";
  }

  function cacherMessage() {

    const message = document.getElementById("message");

    message.style.display = "none";
  }


  // CRÉATION DU COMPTE
  document.getElementById("inscription").addEventListener("submit", function(e) {

    e.preventDefault();

    const nom = document.getElementById("nomInscription").value.trim();
    const telephone = document.getElementById("telephoneInscription").value.trim();
    const email = document.getElementById("emailInscription").value.trim().toLowerCase();
    const password = document.getElementById("passwordInscription").value;
    const confirmation = document.getElementById("confirmationPassword").value;

    if (password !== confirmation) {

      afficherMessage(
        "❌ Les mots de passe ne correspondent pas.",
        "error"
      );

      return;
    }

    let utilisateurs =
      JSON.parse(localStorage.getItem("vendozaUtilisateurs")) || [];

    const existe = utilisateurs.find(
      utilisateur => utilisateur.email === email
    );

    if (existe) {

      afficherMessage(
        "❌ Cette adresse email possède déjà un compte.",
        "error"
      );

      return;
    }

    const utilisateur = {
      id: "USR-" + Date.now(),
      nom: nom,
      telephone: telephone,
      email: email,
      password: password,
      dateCreation: new Date().toLocaleString("fr-FR")
    };

    utilisateurs.push(utilisateur);

    localStorage.setItem(
      "vendozaUtilisateurs",
      JSON.stringify(utilisateurs)
    );

    // Connexion automatique
    localStorage.setItem(
      "vendozaUtilisateurConnecte",
      JSON.stringify(utilisateur)
    );

    afficherMessage(
      "✅ Compte créé avec succès ! Redirection...",
      "success"
    );

    setTimeout(() => {
      window.location.href = "produits.html";
    }, 1200);

  });


  // CONNEXION
  document.getElementById("connexion").addEventListener("submit", function(e) {

    e.preventDefault();

    const email =
      document.getElementById("emailConnexion")
      .value
      .trim()
      .toLowerCase();

    const password =
      document.getElementById("passwordConnexion").value;

    let utilisateurs =
      JSON.parse(localStorage.getItem("vendozaUtilisateurs")) || [];

    const utilisateur = utilisateurs.find(
      user =>
        user.email === email &&
        user.password === password
    );

    if (!utilisateur) {

      afficherMessage(
        "❌ Email ou mot de passe incorrect.",
        "error"
      );

      return;
    }

    localStorage.setItem(
      "vendozaUtilisateurConnecte",
      JSON.stringify(utilisateur)
    );

    afficherMessage(
      "✅ Connexion réussie ! Redirection...",
      "success"
    );

    setTimeout(() => {
      window.location.href = "produits.html";
    }, 1000);

  });

</script></body>
</html>
