<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendoza - Connexion</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 25px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 { text-align: center; color: #111; }
    p { text-align: center; color: #666; }

    input {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; }

    #message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .error { color: #a00000; background: #ffe5e5; }
    .success { color: #176b17; background: #e5ffe5; }
    .info { color: #174a8b; background: #e5efff; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="container">
  <h1>Connexion Vendoza</h1>
  <p>Connectez-vous à votre compte</p>

  <form id="loginForm">
    <input
      type="email"
      id="email"
      placeholder="Adresse e-mail"
      autocomplete="email"
      required
    >

    <input
      type="password"
      id="password"
      placeholder="Mot de passe"
      autocomplete="current-password"
      required
    >

    <button type="submit" id="loginButton">Se connecter</button>
  </form>

  <div id="message" style="display:none"></div>
</div>

<script>
const formulaire = document.getElementById("loginForm");
const bouton = document.getElementById("loginButton");
const message = document.getElementById("message");

function afficher(texte, type) {
  message.textContent = texte;
  message.className = type;
  message.style.display = "block";
}

formulaire.addEventListener("submit", async function(event) {
  event.preventDefault();

  bouton.disabled = true;
  bouton.textContent = "Connexion...";
  afficher("Vérification de la connexion...", "info");

  try {
    if (!window.supabase || !window.supabase.createClient) {
      throw new Error(
        "La bibliothèque Supabase ne se charge pas. Vérifie Internet."
      );
    }

    // Configuration directe, comme dans le test qui fonctionne.
    const SUPABASE_URL =
      "https://kzrphvyhkbuhaczmnjgk.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_ZvVK-d8qoaqi4__K0cqoyg_IsCaAqPO";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const { data, error } = await client.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    });

    if (error) {
      throw new Error("Erreur de connexion : " + error.message);
    }

    if (!data.user) {
      throw new Error("Aucun utilisateur retourné par Supabase.");
    }

    const { data: profil, error: erreurProfil } = await client
  .from("profiles")
  .select("*")
  .eq("uuid", data.user.id)
  .maybeSingle();

    if (erreurProfil) {
      throw new Error(
        "Connexion réussie, mais erreur du profil : " +
        erreurProfil.message
      );
    }

    if (!profil) {
      throw new Error(
        "Aucun profil trouvé pour ce compte dans la table profiles."
      );
    }

    const role = String(profil.role || "").toLowerCase().trim();

    afficher("Connexion réussie ! Redirection...", "success");

    if (role === "admin") {
      window.location.href = "dashboard.html";
    } else if (role === "client") {
      window.location.href = "produits.html";
    } else if (role === "vendeur") {
      window.location.href = "dashboard-vendeur.html";
    } else {
      throw new Error(
        "Rôle non reconnu : " + (profil.role || "vide")
      );
    }

  } catch (erreur) {
    afficher(erreur.message || String(erreur), "error");
    bouton.disabled = false;
    bouton.textContent = "Se connecter";
  }
});
</script>

</body>
  </html>
