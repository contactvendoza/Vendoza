<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vendoza - Connexion</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 92%;
      max-width: 420px;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      display: none;
      font-size: 14px;
    }

    .info {
      display: block !important;
      background: #e8f1ff;
      color: #174a8b;
    }

    .success {
      display: block !important;
      background: #e8f7e8;
      color: #176b17;
    }

    .error {
      display: block !important;
      background: #ffe8e8;
      color: #a00000;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Connexion Vendoza</h1>

  <input
    type="email"
    id="email"
    placeholder="Votre adresse Gmail"
  >

  <input
    type="password"
    id="password"
    placeholder="Votre mot de passe"
  >

  <button id="loginBtn" onclick="connexion()">
    Se connecter
  </button>

  <div id="message"></div>

</div>

<script>

const SUPABASE_URL = "https://kzrphvyhkbuhaczmnjgk.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_ZvVK-d8qoaqi4__K0cqoyg_IsCaAqPO";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


function afficher(message, type) {

  const box = document.getElementById("message");

  box.textContent = message;
  box.className = type;

}


async function connexion() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const bouton =
    document.getElementById("loginBtn");


  if (!email || !password) {

    afficher(
      "Entre ton adresse email et ton mot de passe.",
      "error"
    );

    return;
  }


  bouton.disabled = true;
  bouton.textContent = "Connexion...";


  afficher(
    "Connexion à Supabase...",
    "info"
  );


  try {

    // ================================
    // 1. CONNEXION AUTH
    // ================================

    const { data, error } =
      await client.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      afficher(

        "ERREUR AUTH SUPABASE\n\n" +

        "Message : " +
        error.message +

        "\n\nCode : " +
        (error.code || "non disponible"),

        "error"

      );

      bouton.disabled = false;
      bouton.textContent = "Se connecter";

      return;
    }


    if (!data || !data.user) {

      afficher(
        "Connexion impossible : utilisateur non trouvé.",
        "error"
      );

      bouton.disabled = false;
      bouton.textContent = "Se connecter";

      return;
    }


    const userId = data.user.id;


    afficher(

      "Connexion réussie ✅\n\n" +

      "User ID : " +
      userId +

      "\n\nRecherche du profil...",

      "info"

    );


    // ================================
    // 2. CHERCHER LE PROFIL
    // ================================

    const { data: profile, error: profileError } =

      await client

        .from("profiles")

        .select("*")

        .eq("id", userId)

        .maybeSingle();


    if (profileError) {

      afficher(

        "ERREUR TABLE PROFILES\n\n" +

        "Message : " +
        profileError.message +

        "\n\nCode : " +
        (profileError.code || "non disponible") +

        "\n\nDetails : " +
        (profileError.details || "non disponible") +

        "\n\nHint : " +
        (profileError.hint || "non disponible"),

        "error"

      );

      bouton.disabled = false;
      bouton.textContent = "Se connecter";

      return;
    }


    if (!profile) {

      afficher(

        "AUTH RÉUSSI ✅\n\n" +

        "Mais aucun profil n'a été trouvé.\n\n" +

        "User ID : " +
        userId,

        "error"

      );

      bouton.disabled = false;
      bouton.textContent = "Se connecter";

      return;
    }


    // ================================
    // 3. ROLE
    // ================================

    const role =
      String(profile.role || "")
      .toLowerCase()
      .trim();


    afficher(

      "Tout fonctionne ✅\n\n" +

      "Nom : " +
      (profile.name || "non défini") +

      "\n\nRole : " +
      (profile.role || "non défini") +

      "\n\nRedirection...",

      "success"

    );


    // ================================
    // 4. REDIRECTION
    // ================================

    setTimeout(function() {

      if (role === "admin") {

        window.location.href =
          "dashboard.html";

      }

      else if (role === "client") {

        window.location.href =
          "produits.html";

      }

      else if (role === "vendeur") {

        window.location.href =
          "dashboard.html";

      }

      else {

        afficher(

          "Connexion réussie mais rôle inconnu.\n\n" +

          "Rôle trouvé : " +
          profile.role,

          "error"

        );

        bouton.disabled = false;
        bouton.textContent = "Se connecter";

      }

    }, 1200);


  }

  catch (e) {

    afficher(

      "ERREUR JAVASCRIPT\n\n" +

      e.message,

      "error"

    );

    bouton.disabled = false;
    bouton.textContent = "Se connecter";

  }

}

</script>

</body>
</html>
