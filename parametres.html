<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Vendoza - Paramètres</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
    }

    .header-content {
      width: 95%;
      max-width: 900px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    h1 {
      margin: 0;
      font-size: 25px;
    }

    .vendeur {
      text-align: right;
    }

    .vendeur-nom {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .logout {
      background: #dc2626;
      color: white;
      border: none;
      padding: 9px 13px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      width: 95%;
      max-width: 900px;
      margin: 25px auto;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .menu a {
      background: #111827;
      color: white;
      text-decoration: none;
      padding: 11px 15px;
      border-radius: 8px;
    }

    .menu a:hover {
      background: #2563eb;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    }

    .box h2 {
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #2563eb;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .save {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .save:hover {
      background: #1d4ed8;
    }

    .success {
      display: none;
      margin-top: 15px;
      padding: 13px;
      background: #dcfce7;
      color: #166534;
      border-radius: 8px;
      font-weight: bold;
    }

    @media (max-width: 600px) {

      .header-content {
        flex-direction: column;
        align-items: flex-start;
      }

      .vendeur {
        text-align: left;
      }

      .menu a {
        width: 100%;
        text-align: center;
      }
    }
  </style></head><body><header>  <div class="header-content"><div>
  <h1>⚙️ Paramètres Vendoza</h1>
  <div>Configuration de votre boutique</div>
</div>

<div class="vendeur">

  <div class="vendeur-nom">
    👤 <span id="vendeurNom">Vendeur</span>
  </div>

  <button
    class="logout"
    onclick="seDeconnecter()"
  >
    🚪 Déconnexion
  </button>

</div>

  </div></header><div class="container">  <div class="menu"><a href="dashboard.html">
  📊 Dashboard
</a>

<a href="produit.html">
  🛍️ Produits
</a>

<a href="commandes.html">
  📦 Commandes
</a>

<a href="clients.html">
  👥 Clients
</a>

<a href="rapports.html">
  📈 Rapports
</a>

<a href="paiements.html">
  💳 Paiements
</a>

  </div>  <div class="box"><h2>🏪 Informations de la boutique</h2>

<p>
  Ces informations peuvent être utilisées plus tard
  sur votre boutique Vendoza.
</p>


<div class="form-group">

  <label for="nomBoutique">
    Nom de la boutique
  </label>

  <input
    type="text"
    id="nomBoutique"
    placeholder="Exemple : Vendoza"
  >

</div>


<div class="form-group">

  <label for="telephone">
    📞 Téléphone
  </label>

  <input
    type="tel"
    id="telephone"
    placeholder="Exemple : +509 0000 0000"
  >

</div>


<div class="form-group">

  <label for="whatsapp">
    💬 WhatsApp
  </label>

  <input
    type="tel"
    id="whatsapp"
    placeholder="Exemple : +509 0000 0000"
  >

</div>


<div class="form-group">

  <label for="email">
    📧 Email
  </label>

  <input
    type="email"
    id="email"
    placeholder="Exemple : contact@vendoza.com"
  >

</div>


<div class="form-group">

  <label for="adresse">
    📍 Adresse
  </label>

  <textarea
    id="adresse"
    placeholder="Adresse de la boutique"
  ></textarea>

</div>


<div class="form-group">

  <label for="description">
    📝 Description de la boutique
  </label>

  <textarea
    id="description"
    placeholder="Présentez brièvement votre boutique..."
  ></textarea>

</div>


<button
  class="save"
  onclick="sauvegarderParametres()"
>
  💾 Enregistrer les paramètres
</button>


<div
  id="messageSucces"
  class="success"
>
  ✅ Les paramètres ont été enregistrés avec succès !
</div>

  </div></div><script>

  // ==========================================
  // PROTECTION VENDEUR
  // ==========================================

  const vendeurConnecte =
    localStorage.getItem(
      "vendozaVendeurConnecte"
    );

  if (vendeurConnecte !== "true") {

    window.location.href =
      "connexion-vendeur.html";

  }


  // ==========================================
  // NOM DU VENDEUR
  // ==========================================

  const vendeurNom =
    localStorage.getItem(
      "vendozaVendeurNom"
    ) || "Vendeur";

  document.getElementById(
    "vendeurNom"
  ).textContent = vendeurNom;


  // ==========================================
  // CHARGER LES PARAMÈTRES
  // ==========================================

  const parametres =
    JSON.parse(
      localStorage.getItem(
        "vendozaParametres"
      )
    ) || {};


  document.getElementById(
    "nomBoutique"
  ).value =
    parametres.nomBoutique || "Vendoza";


  document.getElementById(
    "telephone"
  ).value =
    parametres.telephone || "";


  document.getElementById(
    "whatsapp"
  ).value =
    parametres.whatsapp || "";


  document.getElementById(
    "email"
  ).value =
    parametres.email || "";


  document.getElementById(
    "adresse"
  ).value =
    parametres.adresse || "";


  document.getElementById(
    "description"
  ).value =
    parametres.description || "";


  // ==========================================
  // SAUVEGARDER
  // ==========================================

  function sauvegarderParametres() {

    const nouveauxParametres = {

      nomBoutique:
        document.getElementById(
          "nomBoutique"
        ).value.trim(),

      telephone:
        document.getElementById(
          "telephone"
        ).value.trim(),

      whatsapp:
        document.getElementById(
          "whatsapp"
        ).value.trim(),

      email:
        document.getElementById(
          "email"
        ).value.trim(),

      adresse:
        document.getElementById(
          "adresse"
        ).value.trim(),

      description:
        document.getElementById(
          "description"
        ).value.trim()

    };


    localStorage.setItem(
      "vendozaParametres",
      JSON.stringify(
        nouveauxParametres
      )
    );


    const message =
      document.getElementById(
        "messageSucces"
      );

    message.style.display =
      "block";


    setTimeout(function() {

      message.style.display =
        "none";

    }, 3000);

  }


  // ==========================================
  // DÉCONNEXION
  // ==========================================

  function seDeconnecter() {

    const confirmer =
      confirm(
        "Voulez-vous vraiment vous déconnecter ?"
      );

    if (!confirmer) {
      return;
    }

    localStorage.removeItem(
      "vendozaVendeurConnecte"
    );

    localStorage.removeItem(
      "vendozaVendeurNom"
    );

    window.location.href =
      "connexion-vendeur.html";

  }

</script></body>
</html>
